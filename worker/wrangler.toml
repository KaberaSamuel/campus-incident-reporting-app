name = "storage"
main = "src/index.js"
compatibility_date = "2025-01-01"

# R2 bucket must be created first: `wrangler r2 bucket create incident-reporting-app`
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "incident-reporting-app"

[vars]
FIREBASE_PROJECT_ID = "campus-incident-reporting-app"
# The r2.dev public URL for the bucket (Cloudflare dashboard -> R2 -> Settings).
R2_PUBLIC_URL = "https://pub-57208281b66d433b9dc1243f61b97094.r2.dev"

